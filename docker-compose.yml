version: '3.8'

services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    image: nginx:1.21-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
