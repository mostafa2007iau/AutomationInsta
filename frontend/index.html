<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Automation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Instagram Automation Tool</h1>
            <div id="status-container">
                <span>Status: <b id="login-status">Logged Out</b></span>
                <button id="logout-btn" class="hidden">Logout</button>
            </div>
        </header>

        <!-- Login Section -->
        <section id="login-section">
            <h2>Login to Instagram</h2>
            <div class="login-tabs">
                <button class="tab-link active" data-tab="credentials-login">Credentials</button>
                <button class="tab-link" data-tab="session-login">Session JSON</button>
            </div>

            <!-- Credentials Login Form -->
            <div id="credentials-login" class="tab-content active">
                <form id="credentials-form">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
            </div>

            <!-- Session Login Form -->
            <div id="session-login" class="tab-content">
                <form id="session-form">
                    <textarea id="session-data" placeholder='Enter your session JSON here. e.g., {"sessionid": "...", "csrftoken": "..."}' required></textarea>
                    <button type="submit">Login with Session</button>
                </form>
            </div>
        </section>

        <!-- Main Content Section (Visible after login) -->
        <main id="main-content" class="hidden">
            <!-- Automation Creation Form -->
            <section id="automation-form-section">
                <h2>Create New Automation Task</h2>
                <form id="automation-form">
                    <input type="url" id="post-url" placeholder="Instagram Post URL" required>
                    <input type="text" id="keywords" placeholder="Keywords (comma-separated: price,order)" required>
                    <textarea id="comment-replies" placeholder="Comment Replies (one per line)"></textarea>
                    <textarea id="dm-replies" placeholder="Direct Message Replies (one per line)"></textarea>
                    <div class="checkbox-container">
                        <input type="checkbox" id="followers-only">
                        <label for="followers-only">Respond to followers only</label>
                    </div>
                    <textarea id="follow-message" placeholder="Message for non-followers..."></textarea>
                    <button type="submit">Start Automation</button>
                </form>
            </section>

            <!-- Active Automations List -->
            <section id="active-automations-section">
                <h2>Active Automations</h2>
                <ul id="automations-list">
                    <!-- Tasks will be dynamically inserted here -->
                </ul>
                <button id="refresh-tasks-btn">Refresh List</button>
            </section>
        </main>

        <div id="loading-spinner" class="hidden"></div>
        <div id="message-area"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
