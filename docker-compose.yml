version: '3.8'

services:
  backend:
    build: .
    container_name: insta_automation_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Mount the session files to persist them outside the container
      - ./sessions:/app/sessions
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    image: nginx:1.21-alpine
    container_name: insta_automation_frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sessions:
