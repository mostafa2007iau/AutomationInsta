<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Automation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Instagram Automation Tool</h1>
        <div id="status" class="status-message">Connecting to server...</div>

        <!-- Login Section -->
        <section id="login-section">
            <div class="tabs">
                <button class="tab-link active" onclick="openTab(event, 'credentials-login')">Login with Credentials</button>
                <button class="tab-link" onclick="openTab(event, 'session-login')">Login with Session ID</button>
            </div>

            <div id="credentials-login" class="tab-content" style="display: block;">
                <h2>Login with Username & Password</h2>
                <form id="credentials-login-form">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
            </div>

            <div id="session-login" class="tab-content">
                <h2>Login with Session ID</h2>
                <form id="session-login-form">
                    <div class="form-group">
                        <label for="sessionId">Session ID:</label>
                        <input type="text" id="sessionId" required placeholder="Enter your sessionid string">
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
            </div>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboard-section" style="display: none;">
            <div class="dashboard-header">
                <h2>Welcome, <span id="username-display"></span>!</h2>
                <button id="logout-btn" class="btn btn-danger">Logout</button>
            </div>

            <!-- Add Task Form -->
            <div class="card">
                <h3>Create New Automation Task</h3>
                <form id="task-form">
                    <div class="form-group">
                        <label for="postUrl">Instagram Post URL:</label>
                        <input type="url" id="postUrl" required placeholder="https://www.instagram.com/p/...">
                    </div>
                    <div class="form-group">
                        <label for="keywords">Keywords (comma-separated):</label>
                        <input type="text" id="keywords" required placeholder="e.g., awesome, great, love it">
                    </div>
                    <div class="form-group">
                        <label for="commentReplies">Comment Replies (one per line):</label>
                        <textarea id="commentReplies" rows="4" placeholder="Thanks for the comment!&#10;We appreciate your feedback."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="dmReplies">DM Replies (one per line):</label>
                        <textarea id="dmReplies" rows="4" placeholder="Hello! Thanks for commenting.&#10;We've received your comment."></textarea>
                    </div>
                    <div class="form-group-checkbox">
                        <input type="checkbox" id="mustFollow">
                        <label for="mustFollow">Must be a follower to receive a reply.</label>
                    </div>
                    <button type="submit" class="btn">Add Task</button>
                </form>
            </div>

            <!-- Active Tasks List -->
            <div class="card">
                <h3>Active Automation Tasks</h3>
                <table class="task-table">
                    <thead>
                        <tr>
                            <th>Post URL</th>
                            <th>Keywords</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="task-list">
                        <!-- Tasks will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>

            <!-- Webhook Management -->
            <div class="card">
                <h3>Webhook Management (for n8n)</h3>
                <form id="webhook-form">
                    <div class="form-group">
                        <label for="webhookUrl">Webhook URL:</label>
                        <input type="url" id="webhookUrl" placeholder="Enter your n8n webhook URL">
                    </div>
                    <button type="submit" class="btn">Add Webhook</button>
                </form>
                <ul id="webhook-list" class="webhook-list">
                    <!-- Webhooks will be listed here -->
                </ul>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
